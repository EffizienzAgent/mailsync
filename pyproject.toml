[project]
name = "mailsync"
authors = [{ name = "EffizienzAgent (Tobias Mende)" }]
description = "IMAP mail sync: Sent folder import and reply/close status from the mailbox"
requires-python = ">=3.14"
readme = "README.md"
license = "MIT"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = ["E101", "E501", "W191", "B017", "F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
